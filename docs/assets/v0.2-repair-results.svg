<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop Reflection v0.2 closed-loop evidence</title>
  <desc id="desc">R1 false-positive incident, R2 natural Direct result, and recorded failure repair replay metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">v0.2 Evidence-Driven Repair</text>
  <text x="64" y="106" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Natural routing and recorded-failure replay use separate experimental labels</text>

  <g filter="url(#shadow)">
    <rect x="64" y="145" width="1072" height="105" rx="18" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
  </g>
  <text x="90" y="182" fill="#fda4af" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">R1 INCIDENT — INVALIDATED FALSE POSITIVE</text>
  <text x="90" y="216" fill="#ffe4e6" font-family="Segoe UI, Arial, sans-serif" font-size="20">Internal route failed  ·  hidden suite passed  ·  old evaluator reported success</text>
  <text x="935" y="210" text-anchor="middle" fill="#fb7185" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">FAIL CLOSED</text>

  <g filter="url(#shadow)">
    <rect x="64" y="286" width="510" height="254" rx="22" fill="#0f2f3a" stroke="#22d3ee" stroke-width="2"/>
    <rect x="626" y="286" width="510" height="254" rx="22" fill="#132f26" stroke="#34d399" stroke-width="2"/>
  </g>

  <text x="92" y="330" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">R2 NATURAL ADAPTIVE</text>
  <text x="92" y="378" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Direct path</text>
  <text x="92" y="420" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">1 model call</text>
  <text x="92" y="454" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">751 total tokens</text>
  <text x="92" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">6.98 seconds</text>
  <text x="420" y="459" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">1 / 1</text>
  <text x="420" y="492" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="16">route + hidden pass</text>

  <text x="654" y="330" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">RECORDED FAILURE REPLAY</text>
  <text x="654" y="378" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Repair path</text>
  <text x="654" y="420" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">2 model calls</text>
  <text x="654" y="454" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">3,813 total tokens</text>
  <text x="654" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">14.84 seconds</text>
  <text x="982" y="443" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">2 / 2 route</text>
  <text x="982" y="489" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">6 / 6 hidden</text>

  <rect x="64" y="580" width="1072" height="62" rx="16" fill="#1e293b"/>
  <text x="600" y="619" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="19">Claim boundary: one hard state-machine pilot proves the closed-loop mechanism, not broad statistical superiority.</text>
</svg>
