<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop Reflection v0.3 experiment outcomes</title>
  <desc id="desc">Natural Adaptive passed two of three hard tasks. Prompt-only replay failed its one recorded task. Attempt-history replay passed its one recorded task. Single-run evidence is not statistically significant.</desc>
  <rect width="1000" height="460" rx="20" fill="#0b1220"/>
  <text x="50" y="54" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">v0.3 Hard-task evidence</text>
  <text x="50" y="82" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Pass rate by experiment · sample size shown explicitly</text>

  <line x1="260" y1="100" x2="260" y2="370" stroke="#334155" stroke-width="1"/>
  <line x1="585" y1="100" x2="585" y2="370" stroke="#1e293b" stroke-width="1" stroke-dasharray="5 6"/>
  <line x1="910" y1="100" x2="910" y2="370" stroke="#334155" stroke-width="1"/>
  <text x="260" y="394" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">0%</text>
  <text x="585" y="394" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">50%</text>
  <text x="910" y="394" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">100%</text>

  <text x="50" y="137" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Natural Adaptive</text>
  <text x="50" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Hard matrix · n=3</text>
  <rect x="260" y="116" width="650" height="52" rx="9" fill="#172033"/>
  <rect x="260" y="116" width="433" height="52" rx="9" fill="#14b8a6"/>
  <text x="707" y="149" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">2/3 · 66.7%</text>

  <text x="50" y="247" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Prompt-only replay</text>
  <text x="50" y="270" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Recorded TTL/LRU failure · n=1</text>
  <rect x="260" y="226" width="650" height="52" rx="9" fill="#172033"/>
  <rect x="260" y="226" width="4" height="52" rx="2" fill="#fb7185"/>
  <text x="278" y="259" fill="#fecdd3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">0/1 · 0%</text>

  <text x="50" y="357" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Attempt-history replay</text>
  <text x="50" y="380" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Same recorded failure · n=1</text>
  <rect x="260" y="336" width="650" height="52" rx="9" fill="#8b5cf6"/>
  <text x="894" y="369" text-anchor="end" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1/1 · 100%</text>

  <rect x="50" y="416" width="860" height="1" fill="#334155"/>
  <text x="50" y="440" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Diagnostic single-run evidence; not a statistically significant A/B comparison.</text>
</svg>
