name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,observability]"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run deterministic test suite
        run: >-
          python -m pytest -q
          --ignore=tests/test_sandbox.py
          --ignore=tests/test_managed_sandbox_v2.py
          --ignore=tests/test_docker_v2_integration.py

  docker-integration:
    name: Managed Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,observability]"

      - name: Verify Docker Engine
        run: docker version

      - name: Validate observability Compose configuration
        run: docker compose -f compose.observability.yaml config -q

      - name: Run Docker integration tests
        run: >-
          python -m pytest -q
          tests/test_managed_sandbox_v2.py
          tests/test_docker_v2_integration.py
