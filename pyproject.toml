[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop-reflection"
version = "0.3.0"
description = "Observable and evaluable reflection loops for coding agents"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.48.0,<3",
    "pydantic>=2.13,<3",
]

[project.scripts]
agentloop = "agentloop.main_v2:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "hypothesis>=6.100,<7",
    "ruff>=0.12,<1",
]

observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
